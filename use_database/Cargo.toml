[package]
name = "use_database"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
axum = "0.8.4"
html = "0.6.3"
maud = "0.27.0"
rand = "0.9.2"
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
