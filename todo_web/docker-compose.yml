services:
  todo_web:
    image: todo_web:latest # your locally built image
    container_name: todo_web
    build:
      context: . # build from current directory
    ports:
      - "8080:8080" # expose port
    environment:
      DATABASE_LOCATION: /app/data/todo.db
      ASSETS_LOCATION: /app/assets
      PORT: 8080
    volumes:
      - ./data:/app/data # persist SQLite database
      - ./assets:/app/assets # serve static files if needed
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token $CLOUDFLARE_TOKEN
    container_name: cloudflared
    restart: unless-stopped

networks:
  default:
