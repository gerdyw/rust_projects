services:
  image-stitch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-stitch
    ports:
      - "${SERVICE_PORT:-3000}:3000"
    environment:
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_SCHEMA=${DATABASE_SCHEMA:-image_stitch}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - SERVICE_PORT=${SERVICE_PORT:-3000}
      - API_KEY_MODE=${API_KEY_MODE}
      - API_KEY=${API_KEY}
      - RUST_LOG=${RUST_LOG:-image_stitch=debug,tower_http=debug}
    volumes:
      - ./stitched_images:/app/stitched_images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: image-stitch-db
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
