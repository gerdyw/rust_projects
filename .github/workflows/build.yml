name: Build and Publish Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Cache Cargo registry and target dir to speed up builds
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Set up Rust
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      # Add ARM64 Linux target
      - name: Add ARM64 target
        run: rustup target add aarch64-unknown-linux-gnu

      # Build ARM64 binary
      - name: Build ARM64 release binary
        run: cargo build --release --target aarch64-unknown-linux-gnu

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --build-arg TARGET=release \
            --build-arg BINARY=target/aarch64-unknown-linux-gnu/release/todo_web \
            -t ghcr.io/${{ github.repository }}/todo_web:latest .

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push Docker image to GHCR
      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}/todo_web:latest
