name: Build and Publish Rust Docker Image (ARM64 musl)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Cache Rust dependencies
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('todo_web/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and push ARM64 musl Docker image
      - name: Build and push Docker image (ARM64 musl)
        uses: docker/build-push-action@v5
        with:
          context: ./todo_web
          file: ./todo_web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rust-todo-app:latest
          platforms: linux/arm64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rust-todo-app:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rust-todo-app:cache,mode=max
