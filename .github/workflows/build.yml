name: Build and publish Rust Docker image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - uses: actions/checkout@v4

      # Cache Cargo registry and git sources
      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # Cache musl target compilation for Docker build
      - name: Cache musl build
        uses: actions/cache@v3
        with:
          path: |
            target/aarch64-unknown-linux-musl/release/deps
          key: musl-target-${{ hashFiles('**/Cargo.lock') }}

      # Set up QEMU for cross-building (optional if building ARM64 on x86)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image using Buildx for ARM64
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/<username>/rust-todo-app:latest
          platforms: linux/arm64
